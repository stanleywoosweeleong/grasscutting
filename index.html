<style>
/* Layout: phone-first app shell. Fixed top bar, one scrolling view per tab, fixed bottom tab bar.
   All text comes from content.js in the chosen language. */
:root{
  --bg:#eef2ec; --surface:#fbfcf9; --ink:#1d2a21; --muted:#5a695d; --line:#d3dbd1;
  --bar:#24432f; --bar-ink:#eef5ef;
  --mono:#2f7d4f; --mono-soft:#dcefe2; --di:#8a3f7a; --di-soft:#f3e2ee;
  --warn:#9a6a0c; --warn-soft:#f6ead0;
  --soil:#ddcbaa; --soil-mid:#c4aa7e; --soil-dark:#9c7f55; --water:#3b7cb4; --sun:#e0a419;
  --f-display:"Young Serif", Georgia, "Times New Roman", serif;
  --f-body:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --tabbar:64px; --topbar:56px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121a15; --surface:#1a241e; --ink:#e2eae3; --muted:#9aab9e; --line:#2e3c34;
  --bar:#16211a; --bar-ink:#e2eae3;
  --mono:#72c693; --mono-soft:#1f3628; --di:#d98fc8; --di-soft:#372331;
  --warn:#e2b14e; --warn-soft:#3a2f17;
  --soil:#4a3e2e; --soil-mid:#5e4b33; --soil-dark:#77603f; --water:#6fa8dc; --sun:#e6b84a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121a15; --surface:#1a241e; --ink:#e2eae3; --muted:#9aab9e; --line:#2e3c34;
  --bar:#16211a; --bar-ink:#e2eae3;
  --mono:#72c693; --mono-soft:#1f3628; --di:#d98fc8; --di-soft:#372331;
  --warn:#e2b14e; --warn-soft:#3a2f17;
  --soil:#4a3e2e; --soil-mid:#5e4b33; --soil-dark:#77603f; --water:#6fa8dc; --sun:#e6b84a; color-scheme:dark}
/* Chinese text: system CJK faces (the Latin web fonts have no Chinese glyphs) */
:lang(zh){--f-display:"Noto Serif SC","Source Han Serif SC","Songti SC","SimSun",serif;
  --f-body:system-ui,-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:1.03rem;line-height:1.55;
  -webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;line-height:1.2;text-wrap:balance}
p{margin:0}
a{color:var(--mono)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--mono);outline-offset:2px}
[tabindex="-1"]:focus{outline:none}

/* Top bar */
.top{position:fixed;inset:0 0 auto;z-index:20;background:var(--bar);color:var(--bar-ink);
  padding-top:env(safe-area-inset-top,0px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top-in{height:var(--topbar);display:flex;align-items:center;gap:10px;max-width:720px;margin:0 auto}
.top h1{font-size:1.3rem;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.install,.langbtn{border:1px solid color-mix(in srgb,var(--bar-ink) 40%,transparent);background:transparent;color:var(--bar-ink);
  border-radius:999px;padding:6px 12px;font-size:.85rem;cursor:pointer;white-space:nowrap}
.install{display:none}
.install.show{display:inline-block}
.langbtn{font-weight:700;display:inline-flex;gap:6px;align-items:center}
.langbtn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8}
.offline{font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;opacity:.8}

/* Views */
main{padding-top:calc(var(--topbar) + env(safe-area-inset-top,0px));
  padding-bottom:calc(var(--tabbar) + env(safe-area-inset-bottom,0px) + 24px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.view{max-width:720px;margin:0 auto;padding-top:20px;display:flex;flex-direction:column;gap:16px}
.eyebrow{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.lede{color:var(--muted);font-size:1.02rem}
.view > h2{font-size:1.6rem}
.stack{display:flex;flex-direction:column;gap:16px}

/* Learn accordion */
details.sec{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
details.sec > summary{list-style:none;cursor:pointer;padding:16px;display:grid;grid-template-columns:2rem minmax(0,1fr) 1rem;gap:10px;align-items:start}
details.sec > summary::-webkit-details-marker{display:none}
details.sec > summary .head{display:flex;flex-direction:column;gap:4px;min-width:0}
details.sec > summary h3{font-size:1.1rem}
details.sec > summary .take{color:var(--muted);font-size:.93rem}
details.sec[open] > summary .take{color:var(--ink)}
details.sec > summary .n,details.sec > summary .chev{line-height:1.5}
details.sec > summary .n{font-family:var(--f-display);color:var(--mono)}
details.sec > summary .chev{transition:transform .2s;color:var(--muted)}
details.sec[open] > summary .chev{transform:rotate(90deg)}
.body{padding:0 16px 18px;display:flex;flex-direction:column;gap:12px}
.body ul,.body ol{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:8px}
.cite{font-size:.86rem;color:var(--muted)}
.cite a{white-space:nowrap}
.note{background:var(--warn-soft);border-radius:10px;padding:12px 14px;font-size:.95rem}
.note b{color:var(--warn)}

/* Diagrams and photos */
.fig,.ph{margin:0;display:flex;flex-direction:column;gap:6px}
.fig svg{width:100%;height:auto;display:block;background:var(--bg);border-radius:10px}
.fig figcaption,.ph figcaption{font-size:.8rem;color:var(--muted)}
.ph img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:10px;display:block;background:var(--line)}
.ph.tall img{aspect-ratio:3/4;max-height:420px}
.ph-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ph-row .ph img{aspect-ratio:1/1}
.fig .lb{font:12px var(--f-body);fill:var(--ink)}
.fig .lb.small{font-size:10.5px;fill:var(--muted)}
.fig .lb.strong{font-weight:700}
.fig .lb.title{font:700 13px var(--f-body)}
.fig .lb.mono,.fig .lb.cut{fill:var(--mono)} .fig .lb.di{fill:var(--di)}
.fig .lb.cut{font-weight:700}
.fig .on-soil{fill:var(--ink)} .fig .lb.on-dark{fill:#fff;font-weight:700}
.fig .soil{fill:var(--soil)} .fig .soil.mid{fill:var(--soil-mid)} .fig .soil.dark{fill:var(--soil-dark)} .fig .soil.sand{fill:var(--soil)}
.fig .rule{stroke:var(--line);stroke-width:1}
.fig .legend-bg{fill:var(--bg)}
.fig .leaf{stroke:var(--mono)} .fig .pale{stroke:color-mix(in srgb,var(--mono) 55%,var(--muted))}
.fig .stem{stroke:var(--di)} .fig .dileaf,.fig .dicot{fill:var(--di);opacity:.85}
.fig .flower{fill:var(--sun)}
.fig .root{stroke:var(--ink)} .fig .taproot{fill:var(--ink)} .fig .node{fill:var(--ink)}
.fig .gp{fill:var(--sun);stroke:var(--surface);stroke-width:2}
.fig .arrow,.fig .bracket{stroke:var(--muted);stroke-width:1.6}
.fig .sun{fill:var(--sun)} .fig .sunray path{stroke:var(--sun);stroke-width:2;stroke-linecap:round}
.fig .canopy{fill:color-mix(in srgb,var(--mono) 70%,var(--ink))} .fig .trunk{fill:var(--soil-dark)}
.fig .shade{fill:var(--ink);opacity:.08}
.fig .deadroot{stroke:var(--soil-dark)} .fig .om circle{fill:var(--soil-dark)}
.fig .pore{stroke:var(--bg)} .fig .worm{stroke:#c9707a}
.fig .crumb ellipse{fill:var(--soil-mid);stroke:var(--soil-dark);stroke-width:1}
.fig .hypha{stroke:var(--ink);opacity:.55}
.fig .uparrow{stroke:var(--mono)}
.fig .badge{fill:var(--bar)} .fig .badge-t{font:700 11px var(--f-body);fill:var(--bar-ink)}
.fig .axis{stroke:var(--muted);stroke-width:1.2}
.fig .line-a{stroke:var(--mono)} .fig .line-b{stroke:var(--di)}
.fig .sw-a{fill:var(--mono)} .fig .sw-b{fill:var(--di)}
.fig .cutline{stroke:var(--mono)}
.fig .zone-rest{fill:var(--mono-soft)} .fig .zone-path{fill:var(--surface)} .fig .zone-path.line{stroke:var(--line)}
.fig .zone-ring{fill:var(--surface);stroke:var(--mono);stroke-width:1.5;stroke-dasharray:4 3}
.fig .tuft{stroke:var(--mono);stroke-width:1.4;opacity:.6}
.fig .mulch path{stroke:var(--soil-dark);stroke-width:3;stroke-linecap:round}
.fig .drop path{fill:var(--water)}
.fig .crack path{stroke:var(--soil-dark);stroke-width:1.6}

/* Section card: its main diagram shows before the section is opened */
details.sec > summary .hero{grid-column:1/-1}
details.sec > summary .hero .fig svg{background:var(--bg)}
.fig,.ph{position:relative;cursor:zoom-in}
.zoomhint{position:absolute;top:6px;right:6px;width:28px;height:28px;border-radius:50%;background:rgb(0 0 0 / .45);display:grid;place-items:center;pointer-events:none}
.zoomhint svg{width:16px;height:16px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round}
.fig:focus-visible,.ph:focus-visible{outline:2px solid var(--mono);outline-offset:3px;border-radius:10px}
.fig .blade{fill:var(--mono)} .fig .vein path{stroke:var(--surface);stroke-width:1.1;opacity:.8}
.fig .nodule circle{fill:#d9849a;stroke:var(--ink);stroke-width:.8}
.fig .arrow-n{stroke:var(--mono)} .fig .arrow-s{stroke:var(--sun)} .fig .ahead{fill:var(--muted)}
.fig .cycle{stroke:var(--mono)}
.fig .bud circle{fill:#cfc78a;stroke:var(--soil-dark);stroke-width:.8} .fig .trunk-line{stroke:var(--soil-dark)}
.fig .tl{stroke:var(--line);stroke-width:3} .fig .tl-dot{fill:var(--surface);stroke:var(--mono);stroke-width:2}
.fig .leafx{fill:var(--mono-soft);stroke:var(--mono);stroke-width:1.5}
.fig .mixup path{stroke:#c0453b;stroke-linecap:round}
.fig .sheath circle{fill:var(--mono)}
.fig .leaf-new{fill:#9fd6a8} .fig .leaf-old{fill:color-mix(in srgb,var(--mono) 70%,#000)}

/* Full-screen viewer */
.viewer{position:fixed;inset:0;z-index:70;background:rgb(10 14 11 / .94);display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.viewer .v-bar{display:flex;justify-content:flex-end;padding:8px max(8px,env(safe-area-inset-right,0px)) 0 8px}
.viewer .v-close{width:44px;height:44px;border-radius:50%;border:0;background:rgb(255 255 255 / .16);color:#fff;font-size:1.6rem;line-height:1;cursor:pointer}
.viewer .v-stage{flex:1;overflow:auto;display:flex;align-items:center;justify-content:center;padding:8px;-webkit-overflow-scrolling:touch}
.viewer .v-stage img{max-width:100%;max-height:100%;border-radius:8px;cursor:zoom-in}
.viewer .v-fig svg{border-radius:8px}
.viewer .v-fig{width:100%;max-width:900px;cursor:zoom-in}
.viewer .v-fig svg{width:100%;height:auto;background:var(--bg)}
.viewer .v-stage.zoomed{align-items:flex-start;justify-content:flex-start}
.viewer .v-stage.zoomed img,.viewer .v-stage.zoomed .v-fig{max-width:none;max-height:none;width:250%;flex:none;cursor:zoom-out}
.viewer .v-cap{color:#e8eee9;font-size:.9rem;padding:8px max(16px,env(safe-area-inset-left,0px)) 4px;text-align:center}
.viewer .v-hint{color:#9fb0a3;font-size:.78rem;padding:0 16px 12px;text-align:center}

/* Compare rows (mobile-friendly tables) */
.compare{display:flex;flex-direction:column;gap:10px}
.crow{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.crow .k{font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:8px 12px 0}
.crow .vals{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px 12px}
.crow .vals div{font-size:.93rem;padding:8px 10px;border-radius:8px}
.crow .a{background:var(--mono-soft)} .crow .b{background:var(--di-soft)}
.crow .vals small{display:block;font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;font-weight:700;margin-bottom:2px}
.crow .a small{color:var(--mono)} .crow .b small{color:var(--di)}
.crow .why{font-size:.88rem;color:var(--muted);padding:0 12px 10px}

/* Durian */
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;border-radius:9px;padding:10px 8px;background:transparent;cursor:pointer;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--bar);color:var(--bar-ink)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px}
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.checks label{display:grid;grid-template-columns:1.5rem minmax(0,1fr);gap:10px;align-items:start;padding:8px 0;cursor:pointer}
.checks input{width:1.25rem;height:1.25rem;margin:2px 0 0;accent-color:var(--mono)}
.checks input:checked + span{color:var(--muted);text-decoration:line-through}
.reset{align-self:flex-start;border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 14px;font-size:.88rem;cursor:pointer}

/* Sources */
.refs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;border-top:1px solid var(--line)}
.refs li{padding:12px 0;border-bottom:1px solid var(--line);font-size:.93rem}
.refs a{word-break:break-all}
.refs li{display:flex;flex-direction:column;gap:6px}
.ref-t{color:var(--muted);font-size:.86rem}
.ref-f{color:var(--ink);font-size:.95rem}
.ref-b{display:flex;flex-wrap:wrap;gap:6px}
.ref-b span,.ref-b a{font-size:.75rem;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);text-decoration:none;word-break:normal}
.ref-b .badge-f{border-color:var(--mono);color:var(--mono);font-weight:700}
.ref-b .badge-c{background:var(--surface)}

/* Tab bar */
.tabs{position:fixed;inset:auto 0 0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);
  padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.tabs-in{height:var(--tabbar);display:grid;grid-template-columns:repeat(3,1fr);max-width:720px;margin:0 auto}
.tabs a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-decoration:none;color:var(--muted);font-size:.74rem;font-weight:700}
.tabs svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs a[aria-current="page"]{color:var(--mono)}

/* Language sheet */
.scrim{position:fixed;inset:0;z-index:40;background:rgb(0 0 0 / .45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:520px;border-radius:16px 16px 0 0;
  padding-top:20px;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:12px}
.sheet h2{font-size:1.3rem}
.langs{display:flex;flex-direction:column;gap:8px}
.langs button{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;cursor:pointer;
  border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:14px 16px;font-size:1.05rem;font-weight:700}
.langs button[aria-pressed="true"]{border-color:var(--mono);background:var(--mono-soft)}
.langs button span{font-weight:400;color:var(--muted);font-size:.85rem}
.linkbtn{border:0;background:transparent;color:var(--mono);text-decoration:underline;cursor:pointer;padding:6px 0}
.primary{border:0;background:var(--bar);color:var(--bar-ink);border-radius:12px;padding:14px 18px;font-weight:700;cursor:pointer;font-size:1rem}

/* Settings sheet */
.set-row{display:grid;grid-template-columns:28px minmax(0,1fr) auto 14px;gap:10px;align-items:center;width:100%;text-align:left;cursor:pointer;
  border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:12px 14px;font-size:1rem}
.set-row .set-v{color:var(--muted);font-size:.9rem}
.set-row.plain{grid-template-columns:minmax(0,1fr) auto 14px}
.set-row .chev{color:var(--muted)}
.set-ic svg{width:22px;height:22px;fill:none;stroke:var(--mono);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block}
.set-block{display:flex;flex-direction:column;gap:8px;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:12px 14px}
.set-block .set-l{font-weight:700}
.set-row .set-l{font-weight:700}
.seg.three{grid-template-columns:repeat(3,1fr)} .seg.four{grid-template-columns:repeat(4,1fr)}
.seg.four button{line-height:1;padding:8px 4px}
.seg.four button span{display:block}
.backbtn{align-self:flex-start;border:0;background:transparent;color:var(--mono);font-weight:700;cursor:pointer;padding:4px 0;font-size:1rem}

/* Share sheet */
.iconbtn{border:1px solid color-mix(in srgb,var(--bar-ink) 40%,transparent);background:transparent;color:var(--bar-ink);border-radius:999px;width:34px;height:34px;display:grid;place-items:center;cursor:pointer;flex:none}
.iconbtn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8}
.sheet.share{max-height:92vh;overflow:auto}
.qrbox{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.qrbox img{width:180px;height:180px;background:#fff;padding:10px;border-radius:12px;border:1px solid var(--line)}
.qr-url{word-break:break-all;color:var(--ink)}
.wa-chat{background:#e8ddd2;border-radius:12px;padding:12px;display:flex;justify-content:flex-end}
.wa-bubble{background:#d9fdd3;color:#111b21;border-radius:10px 2px 10px 10px;padding:4px;max-width:88%;box-shadow:0 1px .5px rgb(0 0 0 / .13)}
.wa-card{background:rgb(0 0 0 / .05);border-radius:8px;overflow:hidden}
.wa-card img{width:100%;display:block;aspect-ratio:1200/630;object-fit:cover}
.wa-card-t{display:flex;flex-direction:column;gap:2px;padding:6px 8px;font-size:.82rem}
.wa-card-t span{color:#54656f}
.wa-card-t small{color:#8696a0;font-size:.72rem}
.wa-text{padding:6px 6px 4px;font-size:.88rem;white-space:pre-wrap;word-break:break-word}
.wa-text a{color:#027eb5}
.share-actions{display:flex;flex-direction:column;gap:8px}
.quiet{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 20px}
.quiet .linkbtn{font-weight:700;text-decoration:none;padding:8px 2px}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.xbtn{flex:none;width:36px;height:36px;border-radius:50%;border:0;background:var(--line);color:var(--ink);font-size:1.4rem;line-height:1;cursor:pointer}

.primary.wa{background:#1fa855;color:#fff;display:flex;gap:8px;align-items:center;justify-content:center;text-decoration:none}
.primary.wa svg{width:20px;height:20px;fill:none;stroke:#fff;stroke-width:1.6}
.ghost{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:12px;font-weight:700;cursor:pointer}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .wa-chat{background:#0b141a}:root:not([data-theme="light"]) .wa-bubble{background:#005c4b;color:#e9edef}:root:not([data-theme="light"]) .wa-card-t span{color:#aebac1}:root:not([data-theme="light"]) .wa-text a{color:#53bdeb}}
:root[data-theme="dark"] .wa-chat{background:#0b141a}
:root[data-theme="dark"] .wa-bubble{background:#005c4b;color:#e9edef}
:root[data-theme="dark"] .wa-card-t span{color:#aebac1}
:root[data-theme="dark"] .wa-text a{color:#53bdeb}

/* Onboarding */
.onboard{position:fixed;inset:0;z-index:50;background:var(--bg);overflow:auto;
  padding-top:calc(20px + env(safe-area-inset-top,0px));padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));
  padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.ob-in{max-width:480px;min-height:100%;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.ob-top{display:flex;justify-content:space-between;align-items:center;min-height:40px}
.ob-top img{width:48px;height:48px;border-radius:12px}
.ob-pick{display:flex;flex-direction:column;gap:4px;text-align:center;margin-top:8px}
.ob-pick h2{font-size:1.45rem;line-height:1.35}
.ob-pick h2 + h2{color:var(--muted);font-size:1.15rem}
.tip{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:start;background:var(--mono-soft);border-radius:12px;padding:12px 8px 12px 14px;font-size:.93rem}
.tip button{border:0;background:transparent;color:var(--muted);font-size:1.3rem;line-height:1;padding:2px 8px;cursor:pointer}
.ob-actions{margin-top:auto;display:flex;flex-direction:column;gap:10px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabbar) + env(safe-area-inset-bottom,0px) + 14px);
  background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:.9rem;z-index:60;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <h1 id="appName"></h1>
    <span class="offline" id="offline" hidden></span>
    <button class="install" id="installBtn" type="button"></button>
    <button class="iconbtn" id="setBtn" type="button" aria-haspopup="dialog"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v2.6M12 18.9v2.6M4.6 4.6l1.9 1.9M17.5 17.5l1.9 1.9M2.5 12h2.6M18.9 12h2.6M4.6 19.4l1.9-1.9M17.5 6.5l1.9-1.9"/><circle cx="12" cy="12" r="6.6"/></svg></button>
  </div>
</header>

<main>
<section class="view" id="learn" aria-labelledby="h-learn">
  <span class="eyebrow" data-t="learn.eyebrow"></span>
  <h2 id="h-learn" data-t="learn.h2"></h2>
  <p class="lede" data-t="learn.lede"></p>
  <div class="tip" id="tip" hidden><p data-h="tip.text"></p><button type="button" id="tipClose">×</button></div>
  <div class="stack" id="secList"></div>
</section>

<section class="view" id="durian" aria-labelledby="h-durian" hidden>
  <span class="eyebrow" data-t="durian.eyebrow"></span>
  <h2 id="h-durian" data-t="durian.h2"></h2>
  <p class="lede" data-t="durian.lede"></p>
  <div id="durianFig"></div>
  <div class="seg" role="group">
    <button type="button" id="seg-normal" data-season="normal" aria-pressed="true" data-t="durian.normal"></button>
    <button type="button" id="seg-induction" data-season="induction" aria-pressed="false" data-t="durian.induction"></button>
  </div>
  <div class="card" id="season-normal">
    <h3 data-t="durian.normalTitle"></h3>
    <ul class="checks" data-list="normal"></ul>
    <button class="reset" type="button" data-reset="normal" data-t="durian.clear"></button>
  </div>
  <div class="card" id="season-induction" hidden>
    <h3 data-t="durian.inductionTitle"></h3>
    <div id="inductionFig"></div>
    <ul class="checks" data-list="induction"></ul>
    <div id="budPhoto"></div>
    <button class="reset" type="button" data-reset="induction" data-t="durian.clear"></button>
  </div>
  <p class="cite" data-h="durian.cite"></p>
</section>

<section class="view" id="sources" aria-labelledby="h-sources" hidden>
  <span class="eyebrow" data-t="sources.eyebrow"></span>
  <h2 id="h-sources" data-t="sources.h2"></h2>
  <p class="lede" data-t="sources.lede"></p>
  <p class="cite" id="refNote"></p>
  <ul class="refs" id="refList"></ul>
  <h3 data-t="photo.heading" style="margin-top:12px"></h3>
  <p class="lede" data-t="photo.lede"></p>
  <ul class="refs" id="photoCredits"></ul>
</section>
</main>

<nav class="tabs">
  <div class="tabs-in">
    <a href="#learn" data-tab="learn"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21V11M12 11c0-4 3-7 7-7 0 4-3 7-7 7zM12 14c0-3-2.5-5-6-5 0 3 2.5 5 6 5z"/><path d="M4 21h16"/></svg><span data-t="tabs.learn"></span></a>
    <a href="#durian" data-tab="durian"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3c4.5 2 7 6 7 10a7 7 0 0 1-14 0c0-4 2.5-8 7-10z"/><path d="M9 11l1.5 1.5M14 10l1 1M10 15l1 1M14.5 14l1 1"/></svg><span data-t="tabs.durian"></span></a>
    <a href="#sources" data-tab="sources"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h9l3 3v15H6z"/><path d="M9 10h6M9 14h6M9 18h4"/></svg><span data-t="tabs.sources"></span></a>
  </div>
</nav>

<div class="scrim" id="setSheet" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="setTitle">
    <div id="setMain" class="stack" style="gap:10px">
      <div class="sheet-head"><h2 id="setTitle" data-t="settings.title" tabindex="-1"></h2><button class="xbtn" type="button" id="setClose">×</button></div>
      <div class="set-block"><span class="set-l" id="langLabel">语言 · Language · Bahasa</span>
        <div class="seg three" role="group" aria-labelledby="langLabel" id="langList"></div></div>
      <div class="set-block"><span class="set-l" id="sizeLabel" data-t="settings.textSize"></span>
        <div class="seg four" role="group" aria-labelledby="sizeLabel" id="sizeSeg"><button type="button" data-size="0"><span style="font-size:0.8rem">A</span></button><button type="button" data-size="1"><span style="font-size:0.95rem">A</span></button><button type="button" data-size="2"><span style="font-size:1.15rem">A</span></button><button type="button" data-size="3"><span style="font-size:1.35rem">A</span></button></div></div>
      <div class="set-block"><span class="set-l" id="themeLabel" data-t="settings.theme"></span>
        <div class="seg three" role="group" aria-labelledby="themeLabel" id="themeSeg"><button type="button" data-theme-opt="system" data-t="settings.themes.system"></button><button type="button" data-theme-opt="light" data-t="settings.themes.light"></button><button type="button" data-theme-opt="dark" data-t="settings.themes.dark"></button></div></div>
      <button class="set-row" id="rowShare" type="button"><span class="set-ic" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="2.6"/><circle cx="6" cy="12" r="2.6"/><circle cx="18" cy="19" r="2.6"/><path d="M8.3 10.8l7.4-4.4M8.3 13.2l7.4 4.4"/></svg></span><span class="set-l" data-t="settings.share"></span><span></span><span class="chev" aria-hidden="true">›</span></button>
    </div>
  </div>
</div>

<div class="scrim" id="shareSheet" hidden>
  <div class="sheet share" role="dialog" aria-modal="true" aria-labelledby="shareTitle">
    <div class="sheet-head"><h2 id="shareTitle" data-t="share.title" tabindex="-1"></h2><button class="xbtn" type="button" id="shareClose">×</button></div>
    <div class="qrbox"><img id="qrImg" src="qr.svg" alt="" width="180" height="180" onerror="this.parentNode.hidden=true"><p class="cite" data-t="share.scan"></p><p class="cite qr-url" id="qrUrl"></p></div>
    <p class="eyebrow" data-t="share.previewNote"></p>
    <div class="wa-chat" aria-hidden="true">
      <div class="wa-bubble">
        <div class="wa-card"><img src="og-image.png" alt=""><div class="wa-card-t"><b data-t="share.cardTitle"></b><span data-t="share.cardDesc"></span><small id="waDomain"></small></div></div>
        <p class="wa-text" id="waText"></p>
      </div>
    </div>
    <div class="share-actions">
      <a class="primary wa" id="waBtn" href="#" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 0 0-7.8 13.5L3 21l4.6-1.2A9 9 0 1 0 12 3z"/><path d="M9 8.5c0 3.5 3 6.5 6.5 6.5l1.2-1.4-2-1-1 .8a5 5 0 0 1-2.6-2.6l.8-1-1-2z"/></svg><span data-t="share.whatsapp"></span></a>
      <div class="quiet"><button class="linkbtn" type="button" id="copyLinkBtn" data-t="share.copyLink"></button><button class="linkbtn" type="button" id="moreBtn" data-t="share.more" hidden></button></div>
    </div>
  </div>
</div>

<div class="onboard" id="onboard" role="dialog" aria-modal="true" hidden>
  <div class="ob-in" id="obIn"></div>
</div>

<div class="viewer" id="viewer" role="dialog" aria-modal="true" hidden>
  <div class="v-bar"><button class="v-close" type="button" id="vClose">×</button></div>
  <div class="v-stage" id="vStage"></div>
  <p class="v-cap" id="vCap"></p>
  <p class="v-hint" id="vHint"></p>
</div>

<div class="toast" id="toast" hidden></div>

<script>/* fresh copies on every visit; the service worker still keeps them for offline use */
['content.js','figures.js'].forEach(f=>document.write('<script src="'+f+'?v='+Date.now()+'"><\/script>'));</script>
<script>
const $=s=>document.querySelector(s);
const store={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch{return d}},
             set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
const LANGS=['zh','en','ms'];
const SIZES=[90,100,115,130];
const THEME_BAR={light:'#24432f',dark:'#16211a'};
const get=(obj,path)=>path.split('.').reduce((o,k)=>o&&o[k],obj);
function guessLang(){const n=(navigator.language||'en').toLowerCase();return n.startsWith('zh')?'zh':(n.startsWith('ms')||n.startsWith('id'))?'ms':'en'}
let lang=store.get('lang',null);
if(!T[lang]) lang=guessLang();

// ---------- render everything in the chosen language ----------
function render(){
  const L=T[lang];
  document.documentElement.lang=L.htmlLang;
  document.title=L.appName;
  $('#appName').textContent=L.appName;
  $('#setBtn').setAttribute('aria-label',L.settings.open);
  $('#setClose').setAttribute('aria-label',L.viewer.close);$('#shareClose').setAttribute('aria-label',L.viewer.close);
  document.querySelectorAll('#sizeSeg [data-size]').forEach(b=>b.setAttribute('aria-label',L.settings.sizes[b.dataset.size]));
  syncPrefs();
  $('#offline').textContent=L.offline;
  $('#installBtn').textContent=L.install;
  $('#onboard').setAttribute('aria-label',L.appName);
  $('#tipClose').setAttribute('aria-label',L.tip.close);
  $('.seg').setAttribute('aria-label',L.durian.normal+' / '+L.durian.induction);
  $('.tabs').setAttribute('aria-label',[L.tabs.learn,L.tabs.durian,L.tabs.sources].join(', '));
  document.querySelectorAll('[data-t]').forEach(e=>e.textContent=get(L,e.dataset.t));
  document.querySelectorAll('[data-h]').forEach(e=>e.innerHTML=get(L,e.dataset.h));

  const open=[...document.querySelectorAll('details.sec[open]')].map(d=>d.id);
  $('#secList').innerHTML=L.sections.map((s,i)=>{
    const id='s'+(i+1), c=CITES[id];
    const cite=c.map(([n,d])=>d?`<a href="https://doi.org/${d}" target="_blank" rel="noopener">${n}</a>`:n).join(' · ');
    return `<details class="sec" id="${id}"${open.includes(id)?' open':''}>
      <summary><span class="n">${i+1}</span><span class="head"><h3>${s.t}</h3><span class="take">${s.take}</span></span><span class="chev" aria-hidden="true">›</span>${hero(id)?`<div class="hero">${figure(hero(id))}</div>`:''}</summary>
      <div class="body">${block(s.b[0])}${media(id)}${s.b.slice(1).map(block).join('')}<p class="cite">${c.length>1?L.sourceMany:L.sourceOne} ${cite}</p></div></details>`;
  }).join('');

  const ticks=store.get('ticks',{});
  const items=list=>list.map(([id,t])=>`<li><label><input type="checkbox" id="${id}"${ticks[id]?' checked':''}><span>${t}</span></label></li>`).join('');
  $('[data-list="normal"]').innerHTML=items(L.durian.normalItems);
  $('[data-list="induction"]').innerHTML=items(L.durian.inductionItems);
  document.querySelectorAll('.checks input').forEach(i=>i.addEventListener('change',()=>{const t=store.get('ticks',{});t[i.id]=i.checked;store.set('ticks',t)}));

  $('#durianFig').innerHTML=figure('fd')+photo('durianFlowers');
  $('#budPhoto').innerHTML=photo('durianBuds','tall');
  $('#inductionFig').innerHTML=figure('fd2');
  $('#vClose').setAttribute('aria-label',L.viewer.close);
  $('#vHint').textContent=L.viewer.hint;
  $('#photoCredits').innerHTML=Object.entries(PHOTOS).map(([k,p])=>`<li>${L.photo[k]}: <a href="${p.page}" target="_blank" rel="noopener">${p.author}</a>, ${p.license}</li>`).join('');
  $('#qrImg').alt=L.share.scan;
  $('#qrUrl').textContent=APP_URL;
  $('#waDomain').textContent=new URL(APP_URL).host;
  shareText=L.share.text+' '+APP_URL;
  updateShare();
  $('#refList').innerHTML=REFS.map(([t,d])=>{
    const k=d||'crider', m=REFMETA[k]||{}, R=L.refs;
    const badges=[m.cited!=null&&m.cited>0?`<span class="badge-c">${R.cited.replace('{n}',m.cited.toLocaleString(L.htmlLang))}</span>`:'',
      m.free?`<a class="badge-f" href="${m.free}" target="_blank" rel="noopener">${R.free}</a>`:'',
      m.basis?`<span class="badge-b">${R.basis[m.basis]}</span>`:''].filter(Boolean).join('');
    return `<li><span lang="en" class="ref-t">${t}${d?` <a href="https://doi.org/${d}" target="_blank" rel="noopener">doi:${d}</a>`:' '+L.sources.noDoi}</span>${R.findings[k]?`<span class="ref-f">${R.findings[k]}</span>`:''}<span class="ref-b">${badges}</span></li>`;
  }).join('');
  $('#refNote').textContent=L.refs.note;
  $('#langList').innerHTML=LANGS.map(k=>`<button type="button" data-lang="${k}" lang="${T[k].htmlLang}" aria-pressed="${k===lang}">${T[k].native}</button>`).join('');
}
function figure(id){
  const L=T[lang];
  let pic='';try{pic=FIGS[id]({...L.fig[id], ...(id==='fd'?{normal:L.durian.normal,induction:L.durian.induction}:{})})}catch(e){console.warn('figure',id,e);return ''}
  return `<figure class="fig" data-zoom tabindex="0" role="button" aria-label="${L.viewer.open}"><span class="zoomhint" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 L21 21M10.5 7.5v6M7.5 10.5h6"/></svg></span>${pic}${ILLUSTRATIVE.includes(id)?`<figcaption>${L.fig.illus}</figcaption>`:''}</figure>`;
}
function photo(key,cls=''){
  const L=T[lang], p=PHOTOS[key];
  return `<figure class="ph ${cls}" data-zoom tabindex="0" role="button" aria-label="${L.viewer.open}: ${L.photo[key]}"><span class="zoomhint" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 L21 21M10.5 7.5v6M7.5 10.5h6"/></svg></span><img src="${p.file}" alt="${L.photo[key]}" loading="lazy" decoding="async"><figcaption>${L.photo[key]} · ${L.photo.credit} <a href="${p.page}" target="_blank" rel="noopener">${p.author}</a>, ${p.license}</figcaption></figure>`;
}
function hero(id){const m=(MEDIA[id]||[]).find(x=>x.startsWith('fig:'));return m?m.slice(4):null}
function media(id){
  const h=hero(id);
  const items=(MEDIA[id]||[]).map(m=>m.split(':')).filter(([t,k])=>!(t==='fig'&&k===h));
  const figs=items.filter(([t])=>t==='fig').map(([,k])=>figure(k)).join('');
  const photos=items.filter(([t])=>t==='photo').map(([,k])=>k);
  const ph=photos.length>1?`<div class="ph-row">${photos.map(k=>photo(k)).join('')}</div>`:photos.map(k=>photo(k)).join('');
  return figs+ph;
}
function block([type,v]){
  if(type==='p') return `<p>${v}</p>`;
  if(type==='note') return `<p class="note">${v}</p>`;
  if(type==='ol'||type==='ul') return `<${type}>${v.map(x=>`<li>${x}</li>`).join('')}</${type}>`;
  if(type==='cmp') return `<div class="compare">${v.rows.map(([k,a,b,why])=>`<div class="crow"><div class="k">${k}</div><div class="vals"><div class="a"><small>${v.a}</small>${a}</div><div class="b"><small>${v.b}</small>${b}</div></div>${why?`<p class="why">${why}</p>`:''}</div>`).join('')}</div>`;
  return '';
}
function setLang(l){lang=l;store.set('lang',l);render()}

// ---------- tabs ----------
const VIEWS=['learn','durian','sources'];
function show(tab){
  if(!VIEWS.includes(tab)) tab='learn';
  VIEWS.forEach(v=>document.getElementById(v).hidden=v!==tab);
  document.querySelectorAll('.tabs a').forEach(a=>{if(a.dataset.tab===tab)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
}
if('scrollRestoration' in history) history.scrollRestoration='manual';
function route(){show(location.hash.slice(1));window.scrollTo(0,0)}
addEventListener('hashchange',route);

// ---------- durian season ----------
function setSeason(s){
  store.set('season',s);
  document.querySelectorAll('#durian .seg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.season===s));
  $('#season-normal').hidden=s!=='normal'; $('#season-induction').hidden=s!=='induction';
}
document.querySelectorAll('#durian .seg button').forEach(b=>b.addEventListener('click',()=>setSeason(b.dataset.season)));
document.querySelectorAll('.reset').forEach(b=>b.addEventListener('click',()=>{
  const t=store.get('ticks',{});
  document.querySelectorAll(`[data-list="${b.dataset.reset}"] input`).forEach(i=>{i.checked=false;t[i.id]=false});
  store.set('ticks',t); toast(T[lang].durian.cleared);
}));

// ---------- language sheet ----------
function syncPrefs(){
  const size=store.get('textSize',1), theme=store.get('theme','system'), r=document.documentElement;
  r.style.fontSize=SIZES[size]+'%';
  if(theme==='system') delete r.dataset.theme; else r.dataset.theme=theme;
  document.querySelectorAll('meta[name="theme-color"]').forEach(m=>{
    if(!m.dataset.orig) m.dataset.orig=m.content;
    m.content=theme==='system'?m.dataset.orig:THEME_BAR[theme];
  });
  document.querySelectorAll('#sizeSeg [data-size]').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.size===size));
  document.querySelectorAll('#themeSeg [data-theme-opt]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.themeOpt===theme));
}
$('#sizeSeg').addEventListener('click',e=>{const b=e.target.closest('[data-size]');if(b){store.set('textSize',+b.dataset.size);syncPrefs()}});
$('#themeSeg').addEventListener('click',e=>{const b=e.target.closest('[data-theme-opt]');if(b){store.set('theme',b.dataset.themeOpt);syncPrefs()}});

function openSettings(){$('#setSheet').hidden=false;history.pushState({sheet:'settings'},'');$('#setTitle').focus({preventScroll:true})}
function closeSettings(fromBack){if($('#setSheet').hidden)return;$('#setSheet').hidden=true;if(!fromBack&&history.state&&history.state.sheet==='settings')history.back();$('#setBtn').focus()}
$('#setBtn').addEventListener('click',openSettings);
$('#setClose').addEventListener('click',()=>closeSettings());
$('#setSheet').addEventListener('click',e=>{if(e.target.id==='setSheet')closeSettings()});
$('#langList').addEventListener('click',e=>{const b=e.target.closest('[data-lang]');if(b){setLang(b.dataset.lang);$(`#langList [data-lang="${b.dataset.lang}"]`).focus()}});
$('#rowShare').addEventListener('click',()=>{$('#setSheet').hidden=true;openShare(true)});
addEventListener('popstate',()=>closeSettings(true));
addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#setSheet').hidden)closeSettings()});

// ---------- first run: one tap to pick a language, then straight to the content ----------
function startOnboarding(){
  $('#onboard').hidden=false;
  $('#obIn').innerHTML=`<div class="ob-top"><img src="icons/icon-192.png" alt=""></div>
    <div class="ob-pick"><h2 lang="zh-Hans">选择语言</h2><h2 lang="en">Choose your language</h2><h2 lang="ms">Pilih bahasa</h2></div>
    <div class="langs ob-actions">${LANGS.map(k=>`<button type="button" data-lang="${k}" lang="${T[k].htmlLang}" aria-pressed="${k===lang}">${T[k].native}<span>${T[k].code}</span></button>`).join('')}</div>`;
  $('#obIn').querySelectorAll('[data-lang]').forEach(b=>b.addEventListener('click',()=>{
    setLang(b.dataset.lang); store.set('onboarded',true); $('#onboard').hidden=true; location.hash='learn'; route();
  }));
  $('#obIn [aria-pressed="true"]')?.focus();
}

// ---------- tip on Learn (until closed) ----------
$('#tip').hidden=store.get('tipClosed',false);
$('#tipClose').addEventListener('click',()=>{store.set('tipClosed',true);$('#tip').hidden=true});

// ---------- share sheet: QR, WhatsApp preview, copy ----------
function escHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function updateShare(){
  const msg=shareText;
  $('#waText').innerHTML=escHtml(msg).replace(/https?:\/\/\S+/g,u=>`<a>${u}</a>`);
  $('#waBtn').href='https://wa.me/?text='+encodeURIComponent(msg);
}
let shareText='';
async function copy(text,ok){
  try{await navigator.clipboard.writeText(text);toast(ok)}
  catch{const s=getSelection(),r=document.createRange();r.selectNodeContents($('#qrUrl'));s.removeAllRanges();s.addRange(r);toast(T[lang].share.copyFail)}
}
$('#copyLinkBtn').addEventListener('click',()=>copy(APP_URL,T[lang].share.copied));
if(navigator.share){$('#moreBtn').hidden=false;$('#moreBtn').addEventListener('click',()=>navigator.share({title:T[lang].appName,text:shareText}).catch(()=>{}))}
function openShare(fromSettings){$('#shareSheet').hidden=false;if(fromSettings&&history.state&&history.state.sheet==='settings')history.replaceState({sheet:1},'');else history.pushState({sheet:1},'');const sh=$('#shareSheet .sheet');sh.scrollTop=0;$('#shareTitle').focus({preventScroll:true})}
function closeShare(fromBack){if($('#shareSheet').hidden)return;$('#shareSheet').hidden=true;if(!fromBack&&history.state&&history.state.sheet)history.back();$('#setBtn').focus()}
$('#shareClose').addEventListener('click',()=>closeShare());
$('#shareSheet').addEventListener('click',e=>{if(e.target.id==='shareSheet')closeShare()});
addEventListener('popstate',()=>closeShare(true));
addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#shareSheet').hidden)closeShare()});

// ---------- full-screen viewer for photos and diagrams ----------
let lastFig=null;
function openViewer(fig){
  lastFig=fig;
  const img=fig.querySelector('img'), pic=fig.querySelector(':scope > svg');
  $('#vStage').innerHTML=img?`<img src="${img.getAttribute('src')}" alt="${img.alt}">`:`<div class="fig v-fig">${pic.outerHTML}</div>`;
  $('#vStage').classList.remove('zoomed');
  $('#vCap').textContent=(fig.querySelector('figcaption')||{}).textContent||pic.getAttribute('aria-label')||'';
  $('#viewer').setAttribute('aria-label',$('#vCap').textContent);
  $('#viewer').hidden=false;
  history.pushState({viewer:1},'');
  $('#vClose').focus();
}
function closeViewer(fromBack){
  if($('#viewer').hidden) return;
  $('#viewer').hidden=true; $('#vStage').innerHTML='';
  if(!fromBack&&history.state&&history.state.viewer) history.back();
  lastFig?.focus({preventScroll:true});
}
document.addEventListener('click',e=>{
  const f=e.target.closest('[data-zoom]');
  if(f&&!e.target.closest('a')){e.preventDefault();e.stopPropagation();openViewer(f)}
});
document.addEventListener('keydown',e=>{
  const f=e.target.closest&&e.target.closest('[data-zoom]');
  if(f&&(e.key==='Enter'||e.key===' ')){e.preventDefault();openViewer(f)}
  if(e.key==='Escape'&&!$('#viewer').hidden) closeViewer();
});
$('#vClose').addEventListener('click',()=>closeViewer());
$('#vStage').addEventListener('click',e=>{
  const st=$('#vStage');
  if(e.target===st){closeViewer();return}
  st.classList.toggle('zoomed');
  if(st.classList.contains('zoomed')) requestAnimationFrame(()=>{st.scrollLeft=(st.scrollWidth-st.clientWidth)/2;st.scrollTop=(st.scrollHeight-st.clientHeight)/2});
});
addEventListener('popstate',()=>closeViewer(true));

// ---------- toast, offline, install ----------
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,2200)}
function net(){$('#offline').hidden=navigator.onLine}
addEventListener('online',net);addEventListener('offline',net);
let deferred=null;
const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent);
const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone;
addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;$('#installBtn').classList.add('show')});
if(isIOS&&!standalone) $('#installBtn').classList.add('show');
$('#installBtn').addEventListener('click',async()=>{
  if(deferred){deferred.prompt();const r=await deferred.userChoice;deferred=null;if(r.outcome==='accepted')$('#installBtn').classList.remove('show')}
  else if(isIOS) toast(T[lang].iosHint);
});
addEventListener('appinstalled',()=>{$('#installBtn').classList.remove('show');toast(T[lang].installed)});

// ---------- start ----------
render(); setSeason(store.get('season','normal')); net(); route();
if(!store.get('onboarded',false)) startOnboarding();

// Service worker (network-first, so content updates need no version bump)
if('serviceWorker' in navigator){
  addEventListener('load',()=>navigator.serviceWorker.register('sw.js',{updateViaCache:'none'})
    .then(reg=>reg.update()).catch(()=>{}));
}
</script>
</body>
</html>
