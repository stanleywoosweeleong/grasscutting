<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>割草养土</title>
<meta name="description" content="The science of building orchard soil by cutting grass instead of spraying it, written for durian growers. 中文 · English · Bahasa Melayu.">
<meta name="theme-color" content="#24432f" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121a15" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="割草养土">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: phone-first app shell. Fixed top bar, one scrolling view per tab, fixed bottom tab bar.
   All text comes from content.js in the chosen language. */
:root{
  --bg:#eef2ec; --surface:#fbfcf9; --ink:#1d2a21; --muted:#5a695d; --line:#d3dbd1;
  --bar:#24432f; --bar-ink:#eef5ef;
  --mono:#2f7d4f; --mono-soft:#dcefe2; --di:#8a3f7a; --di-soft:#f3e2ee;
  --warn:#9a6a0c; --warn-soft:#f6ead0;
  --f-display:"Young Serif", Georgia, "Times New Roman", serif;
  --f-body:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --tabbar:64px; --topbar:56px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#121a15; --surface:#1a241e; --ink:#e2eae3; --muted:#9aab9e; --line:#2e3c34;
  --bar:#16211a; --bar-ink:#e2eae3;
  --mono:#72c693; --mono-soft:#1f3628; --di:#d98fc8; --di-soft:#372331;
  --warn:#e2b14e; --warn-soft:#3a2f17; color-scheme:dark}}
/* Chinese text: system CJK faces (the Latin web fonts have no Chinese glyphs) */
:lang(zh){--f-display:"Noto Serif SC","Source Han Serif SC","Songti SC","SimSun",serif;
  --f-body:system-ui,-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16.5px;line-height:1.55;
  -webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;line-height:1.2;text-wrap:balance}
p{margin:0}
a{color:var(--mono)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--mono);outline-offset:2px}

/* Top bar */
.top{position:fixed;inset:0 0 auto;z-index:20;background:var(--bar);color:var(--bar-ink);
  padding-top:env(safe-area-inset-top,0px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top-in{height:var(--topbar);display:flex;align-items:center;gap:10px;max-width:720px;margin:0 auto}
.top h1{font-size:1.3rem;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.install,.langbtn{border:1px solid color-mix(in srgb,var(--bar-ink) 40%,transparent);background:transparent;color:var(--bar-ink);
  border-radius:999px;padding:6px 12px;font-size:.85rem;cursor:pointer;white-space:nowrap}
.install{display:none}
.install.show{display:inline-block}
.langbtn{font-weight:700;display:inline-flex;gap:6px;align-items:center}
.langbtn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8}
.offline{font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;opacity:.8}

/* Views */
main{padding-top:calc(var(--topbar) + env(safe-area-inset-top,0px));
  padding-bottom:calc(var(--tabbar) + env(safe-area-inset-bottom,0px) + 24px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.view{max-width:720px;margin:0 auto;padding-top:20px;display:flex;flex-direction:column;gap:16px}
.eyebrow{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.lede{color:var(--muted);font-size:1.02rem}
.view > h2{font-size:1.6rem}
.stack{display:flex;flex-direction:column;gap:16px}

/* Learn accordion */
details.sec{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
details.sec > summary{list-style:none;cursor:pointer;padding:16px;display:grid;grid-template-columns:2rem minmax(0,1fr) 1rem;gap:10px;align-items:start}
details.sec > summary::-webkit-details-marker{display:none}
details.sec > summary .head{display:flex;flex-direction:column;gap:4px;min-width:0}
details.sec > summary h3{font-size:1.1rem}
details.sec > summary .take{color:var(--muted);font-size:.93rem}
details.sec[open] > summary .take{color:var(--ink)}
details.sec > summary .n,details.sec > summary .chev{line-height:1.5}
details.sec > summary .n{font-family:var(--f-display);color:var(--mono)}
details.sec > summary .chev{transition:transform .2s;color:var(--muted)}
details.sec[open] > summary .chev{transform:rotate(90deg)}
.body{padding:0 16px 18px;display:flex;flex-direction:column;gap:12px}
.body ul,.body ol{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:8px}
.cite{font-size:.86rem;color:var(--muted)}
.cite a{white-space:nowrap}
.note{background:var(--warn-soft);border-radius:10px;padding:12px 14px;font-size:.95rem}
.note b{color:var(--warn)}

/* Compare rows (mobile-friendly tables) */
.compare{display:flex;flex-direction:column;gap:10px}
.crow{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.crow .k{font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:8px 12px 0}
.crow .vals{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px 12px}
.crow .vals div{font-size:.93rem;padding:8px 10px;border-radius:8px}
.crow .a{background:var(--mono-soft)} .crow .b{background:var(--di-soft)}
.crow .vals small{display:block;font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;font-weight:700;margin-bottom:2px}
.crow .a small{color:var(--mono)} .crow .b small{color:var(--di)}
.crow .why{font-size:.88rem;color:var(--muted);padding:0 12px 10px}

/* Durian */
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;border-radius:9px;padding:10px 8px;background:transparent;cursor:pointer;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--bar);color:var(--bar-ink)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px}
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.checks label{display:grid;grid-template-columns:1.5rem minmax(0,1fr);gap:10px;align-items:start;padding:8px 0;cursor:pointer}
.checks input{width:1.25rem;height:1.25rem;margin:2px 0 0;accent-color:var(--mono)}
.checks input:checked + span{color:var(--muted);text-decoration:line-through}
.reset{align-self:flex-start;border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 14px;font-size:.88rem;cursor:pointer}

/* Sources */
.refs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;border-top:1px solid var(--line)}
.refs li{padding:12px 0;border-bottom:1px solid var(--line);font-size:.93rem}
.refs a{word-break:break-all}

/* Tab bar */
.tabs{position:fixed;inset:auto 0 0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);
  padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.tabs-in{height:var(--tabbar);display:grid;grid-template-columns:repeat(3,1fr);max-width:720px;margin:0 auto}
.tabs a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-decoration:none;color:var(--muted);font-size:.74rem;font-weight:700}
.tabs svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs a[aria-current="page"]{color:var(--mono)}

/* Language sheet */
.scrim{position:fixed;inset:0;z-index:40;background:rgb(0 0 0 / .45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:520px;border-radius:16px 16px 0 0;
  padding-top:20px;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:12px}
.sheet h2{font-size:1.3rem}
.langs{display:flex;flex-direction:column;gap:8px}
.langs button{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;cursor:pointer;
  border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:14px 16px;font-size:1.05rem;font-weight:700}
.langs button[aria-pressed="true"]{border-color:var(--mono);background:var(--mono-soft)}
.langs button span{font-weight:400;color:var(--muted);font-size:.85rem}
.linkbtn{border:0;background:transparent;color:var(--mono);text-decoration:underline;cursor:pointer;padding:6px 0}
.primary{border:0;background:var(--bar);color:var(--bar-ink);border-radius:12px;padding:14px 18px;font-weight:700;cursor:pointer;font-size:1rem}

/* Onboarding */
.onboard{position:fixed;inset:0;z-index:50;background:var(--bg);overflow:auto;
  padding-top:calc(20px + env(safe-area-inset-top,0px));padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));
  padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.ob-in{max-width:480px;min-height:100%;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.ob-top{display:flex;justify-content:space-between;align-items:center;min-height:40px}
.ob-top img{width:48px;height:48px;border-radius:12px}
.ob-pick{display:flex;flex-direction:column;gap:4px;text-align:center;margin-top:8px}
.ob-pick h2{font-size:1.45rem;line-height:1.35}
.ob-pick h2 + h2{color:var(--muted);font-size:1.15rem}
.tip{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:start;background:var(--mono-soft);border-radius:12px;padding:12px 8px 12px 14px;font-size:.93rem}
.tip button{border:0;background:transparent;color:var(--muted);font-size:1.3rem;line-height:1;padding:2px 8px;cursor:pointer}
.ob-actions{margin-top:auto;display:flex;flex-direction:column;gap:10px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabbar) + env(safe-area-inset-bottom,0px) + 14px);
  background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:.9rem;z-index:60;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <h1 id="appName"></h1>
    <span class="offline" id="offline" hidden></span>
    <button class="install" id="installBtn" type="button"></button>
    <button class="langbtn" id="langBtn" type="button" aria-haspopup="dialog"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"/></svg><span id="langCode"></span></button>
  </div>
</header>

<main>
<section class="view" id="learn" aria-labelledby="h-learn">
  <span class="eyebrow" data-t="learn.eyebrow"></span>
  <h2 id="h-learn" data-t="learn.h2"></h2>
  <p class="lede" data-t="learn.lede"></p>
  <div class="tip" id="tip" hidden><p data-h="tip.text"></p><button type="button" id="tipClose">×</button></div>
  <div class="stack" id="secList"></div>
</section>

<section class="view" id="durian" aria-labelledby="h-durian" hidden>
  <span class="eyebrow" data-t="durian.eyebrow"></span>
  <h2 id="h-durian" data-t="durian.h2"></h2>
  <p class="lede" data-t="durian.lede"></p>
  <div class="seg" role="group">
    <button type="button" id="seg-normal" data-season="normal" aria-pressed="true" data-t="durian.normal"></button>
    <button type="button" id="seg-induction" data-season="induction" aria-pressed="false" data-t="durian.induction"></button>
  </div>
  <div class="card" id="season-normal">
    <h3 data-t="durian.normalTitle"></h3>
    <ul class="checks" data-list="normal"></ul>
    <button class="reset" type="button" data-reset="normal" data-t="durian.clear"></button>
  </div>
  <div class="card" id="season-induction" hidden>
    <h3 data-t="durian.inductionTitle"></h3>
    <ul class="checks" data-list="induction"></ul>
    <button class="reset" type="button" data-reset="induction" data-t="durian.clear"></button>
  </div>
  <p class="cite" data-h="durian.cite"></p>
</section>

<section class="view" id="sources" aria-labelledby="h-sources" hidden>
  <span class="eyebrow" data-t="sources.eyebrow"></span>
  <h2 id="h-sources" data-t="sources.h2"></h2>
  <p class="lede" data-t="sources.lede"></p>
  <ul class="refs" id="refList"></ul>
</section>
</main>

<nav class="tabs">
  <div class="tabs-in">
    <a href="#learn" data-tab="learn"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21V11M12 11c0-4 3-7 7-7 0 4-3 7-7 7zM12 14c0-3-2.5-5-6-5 0 3 2.5 5 6 5z"/><path d="M4 21h16"/></svg><span data-t="tabs.learn"></span></a>
    <a href="#durian" data-tab="durian"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3c4.5 2 7 6 7 10a7 7 0 0 1-14 0c0-4 2.5-8 7-10z"/><path d="M9 11l1.5 1.5M14 10l1 1M10 15l1 1M14.5 14l1 1"/></svg><span data-t="tabs.durian"></span></a>
    <a href="#sources" data-tab="sources"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h9l3 3v15H6z"/><path d="M9 10h6M9 14h6M9 18h4"/></svg><span data-t="tabs.sources"></span></a>
  </div>
</nav>

<div class="scrim" id="langSheet" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="langTitle">
    <h2 id="langTitle" data-t="langMenu.title"></h2>
    <div class="langs" id="langList"></div>
    <button class="primary" type="button" id="langDone" data-t="langMenu.done"></button>
  </div>
</div>

<div class="onboard" id="onboard" role="dialog" aria-modal="true" hidden>
  <div class="ob-in" id="obIn"></div>
</div>

<div class="toast" id="toast" hidden></div>

<script src="content.js"></script>
<script>
const $=s=>document.querySelector(s);
const store={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch{return d}},
             set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
const LANGS=['zh','en','ms'];
const get=(obj,path)=>path.split('.').reduce((o,k)=>o&&o[k],obj);
function guessLang(){const n=(navigator.language||'en').toLowerCase();return n.startsWith('zh')?'zh':(n.startsWith('ms')||n.startsWith('id'))?'ms':'en'}
let lang=store.get('lang',null);
if(!T[lang]) lang=guessLang();

// ---------- render everything in the chosen language ----------
function render(){
  const L=T[lang];
  document.documentElement.lang=L.htmlLang;
  document.title=L.appName;
  $('#appName').textContent=L.appName;
  $('#langCode').textContent=L.code;
  $('#langBtn').setAttribute('aria-label',L.langMenu.title);
  $('#offline').textContent=L.offline;
  $('#installBtn').textContent=L.install;
  $('#onboard').setAttribute('aria-label',L.appName);
  $('#tipClose').setAttribute('aria-label',L.tip.close);
  $('.seg').setAttribute('aria-label',L.durian.normal+' / '+L.durian.induction);
  $('.tabs').setAttribute('aria-label',[L.tabs.learn,L.tabs.durian,L.tabs.sources].join(', '));
  document.querySelectorAll('[data-t]').forEach(e=>e.textContent=get(L,e.dataset.t));
  document.querySelectorAll('[data-h]').forEach(e=>e.innerHTML=get(L,e.dataset.h));

  const open=[...document.querySelectorAll('details.sec[open]')].map(d=>d.id);
  $('#secList').innerHTML=L.sections.map((s,i)=>{
    const id='s'+(i+1), c=CITES[id];
    const cite=c.map(([n,d])=>d?`<a href="https://doi.org/${d}" target="_blank" rel="noopener">${n}</a>`:n).join(' · ');
    return `<details class="sec" id="${id}"${open.includes(id)?' open':''}>
      <summary><span class="n">${i+1}</span><span class="head"><h3>${s.t}</h3><span class="take">${s.take}</span></span><span class="chev" aria-hidden="true">›</span></summary>
      <div class="body">${s.b.map(block).join('')}<p class="cite">${c.length>1?L.sourceMany:L.sourceOne} ${cite}</p></div></details>`;
  }).join('');

  const ticks=store.get('ticks',{});
  const items=list=>list.map(([id,t])=>`<li><label><input type="checkbox" id="${id}"${ticks[id]?' checked':''}><span>${t}</span></label></li>`).join('');
  $('[data-list="normal"]').innerHTML=items(L.durian.normalItems);
  $('[data-list="induction"]').innerHTML=items(L.durian.inductionItems);
  document.querySelectorAll('.checks input').forEach(i=>i.addEventListener('change',()=>{const t=store.get('ticks',{});t[i.id]=i.checked;store.set('ticks',t)}));

  $('#refList').innerHTML=REFS.map(([t,d])=>`<li lang="en">${t}${d?` <a href="https://doi.org/${d}" target="_blank" rel="noopener">doi:${d}</a>`:' '+L.sources.noDoi}</li>`).join('');
  $('#langList').innerHTML=LANGS.map(k=>`<button type="button" data-lang="${k}" lang="${T[k].htmlLang}" aria-pressed="${k===lang}">${T[k].native}<span>${T[k].code}</span></button>`).join('');
}
function block([type,v]){
  if(type==='p') return `<p>${v}</p>`;
  if(type==='note') return `<p class="note">${v}</p>`;
  if(type==='ol'||type==='ul') return `<${type}>${v.map(x=>`<li>${x}</li>`).join('')}</${type}>`;
  if(type==='cmp') return `<div class="compare">${v.rows.map(([k,a,b,why])=>`<div class="crow"><div class="k">${k}</div><div class="vals"><div class="a"><small>${v.a}</small>${a}</div><div class="b"><small>${v.b}</small>${b}</div></div>${why?`<p class="why">${why}</p>`:''}</div>`).join('')}</div>`;
  return '';
}
function setLang(l){lang=l;store.set('lang',l);render()}

// ---------- tabs ----------
const VIEWS=['learn','durian','sources'];
function show(tab){
  if(!VIEWS.includes(tab)) tab='learn';
  VIEWS.forEach(v=>document.getElementById(v).hidden=v!==tab);
  document.querySelectorAll('.tabs a').forEach(a=>{if(a.dataset.tab===tab)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
}
if('scrollRestoration' in history) history.scrollRestoration='manual';
function route(){show(location.hash.slice(1));window.scrollTo(0,0)}
addEventListener('hashchange',route);

// ---------- durian season ----------
function setSeason(s){
  store.set('season',s);
  document.querySelectorAll('.seg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.season===s));
  $('#season-normal').hidden=s!=='normal'; $('#season-induction').hidden=s!=='induction';
}
document.querySelectorAll('.seg button').forEach(b=>b.addEventListener('click',()=>setSeason(b.dataset.season)));
document.querySelectorAll('.reset').forEach(b=>b.addEventListener('click',()=>{
  const t=store.get('ticks',{});
  document.querySelectorAll(`[data-list="${b.dataset.reset}"] input`).forEach(i=>{i.checked=false;t[i.id]=false});
  store.set('ticks',t); toast(T[lang].durian.cleared);
}));

// ---------- language sheet ----------
function openSheet(){$('#langSheet').hidden=false;$('#langList [aria-pressed="true"]')?.focus()}
function closeSheet(){$('#langSheet').hidden=true;$('#langBtn').focus()}
$('#langBtn').addEventListener('click',openSheet);
$('#langDone').addEventListener('click',closeSheet);
$('#langSheet').addEventListener('click',e=>{if(e.target.id==='langSheet')closeSheet()});
$('#langList').addEventListener('click',e=>{const b=e.target.closest('[data-lang]');if(b){setLang(b.dataset.lang);$(`#langList [data-lang="${b.dataset.lang}"]`).focus()}});
addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#langSheet').hidden)closeSheet()});

// ---------- first run: one tap to pick a language, then straight to the content ----------
function startOnboarding(){
  $('#onboard').hidden=false;
  $('#obIn').innerHTML=`<div class="ob-top"><img src="icons/icon-192.png" alt=""></div>
    <div class="ob-pick"><h2 lang="zh-Hans">选择语言</h2><h2 lang="en">Choose your language</h2><h2 lang="ms">Pilih bahasa</h2></div>
    <div class="langs ob-actions">${LANGS.map(k=>`<button type="button" data-lang="${k}" lang="${T[k].htmlLang}" aria-pressed="${k===lang}">${T[k].native}<span>${T[k].code}</span></button>`).join('')}</div>`;
  $('#obIn').querySelectorAll('[data-lang]').forEach(b=>b.addEventListener('click',()=>{
    setLang(b.dataset.lang); store.set('onboarded',true); $('#onboard').hidden=true; location.hash='learn'; route();
  }));
  $('#obIn [aria-pressed="true"]')?.focus();
}

// ---------- tip on Learn (until closed) ----------
$('#tip').hidden=store.get('tipClosed',false);
$('#tipClose').addEventListener('click',()=>{store.set('tipClosed',true);$('#tip').hidden=true});

// ---------- toast, offline, install ----------
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,2200)}
function net(){$('#offline').hidden=navigator.onLine}
addEventListener('online',net);addEventListener('offline',net);
let deferred=null;
const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent);
const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone;
addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;$('#installBtn').classList.add('show')});
if(isIOS&&!standalone) $('#installBtn').classList.add('show');
$('#installBtn').addEventListener('click',async()=>{
  if(deferred){deferred.prompt();const r=await deferred.userChoice;deferred=null;if(r.outcome==='accepted')$('#installBtn').classList.remove('show')}
  else if(isIOS) toast(T[lang].iosHint);
});
addEventListener('appinstalled',()=>{$('#installBtn').classList.remove('show');toast(T[lang].installed)});

// ---------- start ----------
render(); setSeason(store.get('season','normal')); net(); route();
if(!store.get('onboarded',false)) startOnboarding();

// Service worker (network-first, so content updates need no version bump)
if('serviceWorker' in navigator){
  addEventListener('load',()=>navigator.serviceWorker.register('sw.js',{updateViaCache:'none'})
    .then(reg=>reg.update()).catch(()=>{}));
}
</script>
</body>
</html>
